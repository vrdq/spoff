[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spoff"
version = "0.1.0"
description = "Fast, minimalist, dark-monochrome Spotify & YouTube streaming music TUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yassinMMK" }]
keywords = ["spotify", "youtube", "music", "player", "tui", "cli", "audio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "textual>=8.0.0",
    "rich>=13.0.0",
    "yt-dlp>=2024.0.0",
]

[project.scripts]
spoff = "spoff.app:main"

[tool.hatch.build.targets.wheel]
packages = ["spoff"]
