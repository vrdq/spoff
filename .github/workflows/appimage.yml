name: Build and Release AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools and python-appimage
        run: |
          python -m pip install --upgrade pip build wheel
          pip install python-appimage

      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Build AppImage
        run: |
          WHEEL=$(ls dist/*.whl | head -n 1)
          python -m python_appimage build app -p 3.11 "$WHEEL"
          # Find generated AppImage and standardize name
          mv spoff-*.AppImage spoff-x86_64.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spoff-x86_64.AppImage
          path: spoff-x86_64.AppImage

      - name: Attach AppImage to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: spoff-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
