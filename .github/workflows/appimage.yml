name: Build and Release AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build python-appimage
          sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Build wheel
        run: python -m build --wheel

      - name: Build AppImage
        run: |
          # python-appimage builds from a recipe folder, not from a wheel.
          RECIPE="$RUNNER_TEMP/recipe"
          mkdir -p "$RECIPE"
          cp packaging/appimage/entrypoint.sh packaging/appimage/spoff.desktop "$RECIPE/"
          rsvg-convert -w 256 -h 256 packaging/flatpak/dev.vrdq.spoff.svg -o "$RECIPE/spoff.png"
          ls "$PWD"/dist/*.whl > "$RECIPE/requirements.txt"
          python -m python_appimage build app -p 3.12 "$RECIPE"
          mv Spoff-x86_64.AppImage spoff-x86_64.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spoff-x86_64.AppImage
          path: spoff-x86_64.AppImage

      - name: Attach AppImage to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: spoff-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
